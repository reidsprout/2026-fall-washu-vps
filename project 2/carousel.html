    /* https://css-tricks.com/pure-css-horizontal-scrolling/ */
    
    html {
    scroll-behavior: smooth;
    }
    body {
        font-family: Helvetica, sans-serif;
        font-weight: bold;
        margin: 0px;
        padding: 0px;
    }
    a {
        color: black;
        text-decoration:none;
        transition: 1s;
    }
    a:hover {
        color: royalblue;
    }
    .other {
        color: royalblue;
    }
    .other:hover {
        color: black;
    }
    .header {
        border-bottom: solid;
        padding: 10px;
        padding-top: 15px;
        position: relative;
        top: 0px;
        left: 0px;
        right: 0px;
        width: 100;
        height: 20px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
    }
    .header-item {
        position: absolute;
    }
    #carousel {
        left: 80px;
    }
    #about {
        right: 55px;
        cursor: pointer;
        transition: 1s;
    }
    #about:hover {
        color: royalblue;
    }
    #backhome {
        right: 10px;
        font-size: 28px;
    }
    #stable {
        left: 170px;
    }
    #field {
        left: 240px;
    }
    .aboutBox {
        border: solid;
        background-color: white;
        width: 500px;
        height: 300px;
        z-index: 5;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: 1s;
        filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.496));
    }
    .aboutBox div {
        padding: 10px;
    }
    #exit {
        font-size: 30px;
        cursor: pointer;
        transition: .2s;
    }
    #exit:hover {
        color: royalblue;
        rotate: 1deg;
    }
    .aboutactive {
        visibility: visible;
        opacity: 1;
    }
    .aboutinactive {
        visibility: hidden;
        opacity: 0;
    }
    .horizontal-scroll-wrapper {
        position: fixed;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        left: -780px;
        bottom: -100px;
        width: 750px;
        height: 120vw;
        margin: 0px;
        overflow-y: auto;
        overflow-x: hidden;
        transform: rotate(90deg);
        transform-origin: right bottom;
    }
    .scroll-item {
        transform: rotate(-90deg) translateY(-200px);
        transform-origin: right bottom;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        transition: 1s;
        max-height: 400px;
        min-height: 300px;
        max-width: 850px;
        padding: 0px;
        opacity: .85;
    }
    .scroll-item img {
        max-height: 700px;
        max-width: 850px;
    }
    .scroll-item:hover {
        margin-right: 40px;
        margin-top: 40px;
        margin-bottom: 40px;
        rotate: -1deg;
        opacity: 1;
    }
    .infotext {
        display: inline-block;
        visibility: hidden;
        position: fixed;
        bottom: 10px;
        left: 10px;
        opacity: 0;
        transition: 2s;
        z-index: 4;
    }
    .scroll-item:hover .infotext {
        visibility: visible;
        opacity: 1;
    }
    #first {
        justify-content: flex-end;
        width: 150px;
        margin-top: 550px;
        margin-bottom: -50px;
        padding-left: 10px;
    }
    #last {
        justify-content: flex-end;
        width: 150px;
        margin-bottom: -200px;
        margin-top: -100px;
    }
    .footer {
        position: fixed;
        border-top: solid;
        width: 100%;
        height: 40px;
        bottom: 0px;
        background-color: white;
        z-index: 2;
    }
    .preloader {
        position: fixed;
        width: 100%;
        height: 100vh;
        background-color: white;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: default;
        animation: fadeOut 2.2s ease 3.9s forwards;
    }
    @keyframes fadeOut {
    to {
    opacity: 0;
    visibility: hidden;
    }
    }
    .preloadimg {
        position: fixed;
        height: 100px;
        top: 50%;
        left: 50%;
        margin-top: -110px;
        margin-left: -80px;
        display: block;
        z-index: 4;
        animation: moveCorner 2s ease 2s forwards;
    }
    @keyframes moveCorner {
    to {
    margin-top: 0px;
    margin-left: 0px;
    top: 5px;
    left: 9px;
    height: 40px;
    }
    }
    </style>
</head>

    <script>
        const exit = document.querySelector('#exit');
        const about = document.querySelector('#about');
        const aboutBox = document.querySelector('.aboutBox');
        about.addEventListener('click', () => {
            aboutBox.classList.remove('aboutinactive');
            aboutBox.classList.add('aboutactive');
        });
        exit.addEventListener('click', () => {
            aboutBox.classList.add('aboutinactive');
            aboutBox.classList.remove('aboutactive');
        });
        document.addEventListener('DOMContentLoaded', () => {
            aboutBox.classList.add('aboutinactive');
            aboutBox.classList.remove('aboutactive');
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);

        if (targetElement) {
        targetElement.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',   // Controls vertical alignment
        inline: 'start'     // Controls horizontal alignment ('start', 'center', 'end')
        });
        }
        });
        });
    </script>
